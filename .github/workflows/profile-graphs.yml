name: Profile graphs

on:
  schedule:
    - cron: "17 18 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main, update]
    paths:
      - ".github/workflows/profile-graphs.yml"

permissions:
  contents: write

concurrency:
  group: profile-graphs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-snake/snake-light.svg?palette=github-light
            profile-snake/snake-dark.svg?palette=github-dark

      - name: Commit updated graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib profile-snake
          if git diff --cached --quiet; then
            echo "Graphs unchanged."
            exit 0
          fi
          git commit -m "Update contribution graphs"
          git push
