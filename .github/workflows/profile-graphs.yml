name: Profile graphs

on:
  schedule:
    - cron: "17 18 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main, update]
    paths:
      - ".github/workflows/profile-graphs.yml"
      - ".github/scripts/rhythm-card.py"

permissions:
  contents: write

concurrency:
  group: profile-graphs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Contribution rhythm card
        run: python3 .github/scripts/rhythm-card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit updated graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib profile-rhythm
          if git diff --cached --quiet; then
            echo "Graphs unchanged."
            exit 0
          fi
          git commit -m "Update contribution graphs"
          git push
